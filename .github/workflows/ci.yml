name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extra only — the runtime has zero dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Assert the runtime really is dependency-free
        run: |
          python - <<'PY'
          import sys, tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          if deps:
              sys.exit(f"unexpected runtime dependencies: {deps}")
          print("zero runtime dependencies, as advertised")
          PY

      - name: Tests (no API key, no network)
        env:
          # Fail loudly if anything in the test path reaches the network.
          BALLAST_LLM_API_KEY: ""
        run: python -m pytest tests -q

      - name: Benchmark must run offline in CI
        run: |
          python -m ballast.cli eval \
            --arms ballast,naive,defective,tight_budget \
            --reps 2 --workers 4 \
            --out bench/results/ci-eval.md

      - name: Skill promotion gate must run offline and must promote something
        run: |
          python -m ballast.cli skills distill
          python -m ballast.cli skills gate | tail -3
          # `gate` exits non-zero when it retires every candidate, so retrieval or
          # grading regression fails the build rather than quietly passing it.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: bench/results/
          retention-days: 14
